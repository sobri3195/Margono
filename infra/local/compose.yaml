services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: margono
      POSTGRES_USER: margono
      POSTGRES_PASSWORD: ${MARGONO_POSTGRES_PASSWORD:?Set MARGONO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${MARGONO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
